<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>차트 배움터</title><style id="cb-gate-style">
.cb-gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:#f1f5f3;color:#14232b;font:20px/1.6 "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;text-align:center;word-break:keep-all}
.cb-gate[hidden]{display:none}.cb-card{max-width:30em;background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 10px 30px rgba(11,93,107,.12)}
.cb-big{font-size:1.3em;font-weight:800;color:#0b5d6b;margin:.2em 0 .5em}.cb-card p{margin:.5em 0}.cb-credit{font-size:.8em;color:#51646b;margin-top:1.2em!important}
.cb-card button{font:inherit;font-weight:800;margin-top:14px;padding:14px 26px;border:0;border-radius:14px;background:#0b5d6b;color:#fff;min-height:56px}
.cb-spin{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;border:6px solid #cfe3de;border-top-color:#0b5d6b;animation:cbspin 1s linear infinite}
@keyframes cbspin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.cb-spin{animation:none}}
</style></head><body><div class="cb-gate"><div class="cb-card"><p class="cb-big">받은 링크로 열어 주세요</p><p>이 공부방은 받은 링크로만 열립니다.</p><p class="cb-credit">만든이 김민수</p></div></div></body></html>
